<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>e-Diploma Login</title>
    <link rel="stylesheet" href="style.css">
    
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    </head>
<head>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <form action="http://localhost/web-project/pages/login.php" method="post">
        <div class="login-box">



            <!-- Εικόνα Λογότυπου -->
          <img src="http://localhost/web-project/logo.jpg" alt="Logo" class="logo">    

            <!-- Πεδία εισόδου -->
         <h3>Email</h3>
            <div class="input-icon">
                <span><i class="fas fa-envelope"></i></span>
                <input type="text" name="email" placeholder="Your Email">
            </div>

            <h3>Password</h3>
            <div class="input-icon">
                <span><i class="fas fa-lock"></i></span>
                <input type="password" name="password" placeholder="Your Password">
            </div>

            <!-- Κουμπί Login -->
            <button type="submit">Login</button>
            <div class="inline-container">
                <h1 class="voice">@ac.upatras.gr</h1>
                <a href="https://www.upnet.gr/support-center/" target="_blank" id="supportlink" class="hidden">Υποστήριξη</a>
            </div>
            
        </div>
        
    </form>




    
   <!-- script use for SEEN UNSEEN PASSWORD -->
  <script>
        function see() {

            var x = document.getElementById("pass");
            if (x.type === "password") {
                x.type = "text";
            }
            else {
                x.type = "password"
            }
        }

    </script>
    
</body>
</html>
